<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rove-icon-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="rove-cyan-grad" x1="18" y1="20" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="rove-bg-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="rove-radar-glow" cx="22" cy="18" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Shell -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#rove-bg-grad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="22" cy="18" r="12" fill="url(#rove-radar-glow)" />

  <!-- Radar Telemetry Sweep Rings -->
  <path d="M23 11C27.4183 11 31 14.5817 31 19" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2" />
  <path d="M21 14C23.7614 14 26 16.2386 26 19" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- Monogram R - Vertical Stem -->
  <rect x="10.5" y="10" width="4.5" height="20" rx="2.25" fill="url(#rove-icon-grad)" />

  <!-- Monogram R - Sweep Loop -->
  <path d="M13 11H21.5C24.8137 11 27.5 13.6863 27.5 17C27.5 20.3137 24.8137 23 21.5 23H14" stroke="url(#rove-icon-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram R - Dynamic Radar Probe Leg -->
  <path d="M19.5 22L27 29.5" stroke="url(#rove-cyan-grad)" stroke-width="4" stroke-linecap="round" />

  <!-- Telemetry Focus Node -->
  <circle cx="20.5" cy="17" r="1.75" fill="#38bdf8" />
</svg>
